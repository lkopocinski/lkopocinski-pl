baseURL = 'https://lkopocinski.github.io/'
languageCode = 'en-us'
title = 'Łukasz Kopociński - Software Engineering'
theme = 'PaperMod'
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  DateFormat = "January 2, 2006"

  # For SEO
  description = "Portfolio and blog about software development and technology"
  keywords = ["portfolio", "blog", "web development", "software engineering", "technology"]
  author = "Łukasz Kopociński"
  # For social media cards
  images = ["/images/avatar.jpeg"]

  # For theme
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hideMeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "Hi, I'm Łukasz 👋"
    Content = """
    Welcome to my website! I specialize in software development.

    - 💼 Check out my [services](/services/)
    - 🎯 Browse my [portfolio](/portfolio/)
    - 📝 Read my [blog](/blog/)
    """

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/lkopocinski"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/lkopocinski"

  # [[params.socialIcons]]
  #   name = "email"
  #   url = "mailto:lkopocinski@gmail.com"

[menu]
  [[menu.main]]
    identifier = "services"
    name = "Services"
    url = "/services/"
    weight = 10

  # [[menu.main]]
  #   identifier = "portfolio"
  #   name = "Portfolio"
  #   url = "/portfolio/"
  #   weight = 20

  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 30

  # [[menu.main]]
  #   identifier = "search"
  #   name = "Search"
  #   url = "/search/"
  #   weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    style = "monokai"
    tabWidth = 4

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[imaging]
  quality = 85
  resampleFilter = "Lanczos"
