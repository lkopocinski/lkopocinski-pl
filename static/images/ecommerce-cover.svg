<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1e293b"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad1)"/>

  <!-- Shopping cart icon -->
  <g transform="translate(450, 180)">
    <path d="M 50 50 L 70 50 L 90 150 L 250 150 L 280 80 L 80 80"
          stroke="#60a5fa" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="110" cy="180" r="15" fill="#60a5fa"/>
    <circle cx="230" cy="180" r="15" fill="#60a5fa"/>

    <!-- Items in cart -->
    <rect x="100" y="90" width="40" height="40" fill="#a78bfa" opacity="0.8" rx="4"/>
    <rect x="150" y="100" width="35" height="35" fill="#c4b5fd" opacity="0.8" rx="4"/>
    <rect x="195" y="95" width="45" height="45" fill="#a78bfa" opacity="0.8" rx="4"/>
  </g>

  <!-- Title -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        fill="#f1f5f9" text-anchor="middle">E-Commerce Platform</text>

  <!-- Subtitle -->
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="28"
        fill="#cbd5e1" text-anchor="middle">Modern Redesign Project</text>

  <!-- Stats -->
  <g transform="translate(300, 510)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#60a5fa">+60%</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Performance</text>
  </g>

  <g transform="translate(520, 510)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#a78bfa">+45%</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Mobile Conv.</text>
  </g>

  <g transform="translate(750, 510)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#60a5fa">+25%</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Revenue</text>
  </g>
</svg>
